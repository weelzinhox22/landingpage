[build]
  command = "npm run build"
  publish = "dist"
  base = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20.11.0"
  NPM_VERSION = "10.2.4"

[dev]
  command = "npm run dev"
  framework = "#custom"
  targetPort = 3000
  port = 8888
  publish = "dist" 
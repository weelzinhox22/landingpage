[build]
  command = "npm run netlify:build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

[dev]
  command = "npm run dev"
  framework = "#custom"
  targetPort = 3000
  port = 8888
  publish = "dist" 